<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>x86 Web Emulator</title>
        <script src="https://cdn.jsdelivr.net/npm/@alexaltea/capstone-js@3.0.5/dist/capstone.min.js"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h2>x86 Instruction Emulator</h2>
        <h3>Select 32-bit ELF File</h3>
        <input type="file" id="fileInput" />
        <div id="fileInfo">Waiting for file...</div>
        <button onclick="runEmulator()">Run Simulation</button>
        <button onclick="stepEmulator()">Step Simulation</button>
        <div id="instructions">Instructions will appear here...</div>

        <div id="output">Simulation logs will appear here...</div>

        <div id="memory">Memory dump will appear here...</div>

        <div class="reg-grid" id="regDisplay"></div>

        <script src="elf.js"></script>
        <script src="memory.js"></script>
        <script src="dist/emulator.js"></script>
    </body>
</html>
